{{- if and (include "kamaji.isEnabled" $) $.Values.global.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  labels:
    {{- include "cluster.labels.common.all" $  | nindent 4 }}
  name: {{ include "cluster.resource.name" $ }}-kamaji
  namespace: kube-system
spec:
  policyRefs:
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  matchConditions:
  - name: kamaji-control-plane
    expression: >-
      request.kind.kind in ['Deployment', 'Pod', 'ReplicaSet'] &&
      request.namespace == '{{ $.Release.Namespace }}' &&
      has(object.metadata.labels) &&
      'kamaji.clastix.io/name' in object.metadata.labels &&
      object.metadata.labels['kamaji.clastix.io/name'] == '{{ include "cluster.resource.name" $ }}'
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  annotations:
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "cluster.labels.common.all" $  | nindent 4 }}
  name: {{ include "cluster.resource.name" $ }}-kamaji-etcd
  namespace: kube-system
spec:
  policyRefs:
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  matchConditions:
  - name: kamaji-etcd
    expression: >-
      request.kind.kind in ['Pod', 'Job'] &&
      request.namespace == '{{ .Release.Namespace }}' &&
      has(object.metadata.name) &&
      object.metadata.name.startsWith('{{ include "cluster.resource.name" $ }}-kamaji-etcd-etcd-')
{{- end }}
