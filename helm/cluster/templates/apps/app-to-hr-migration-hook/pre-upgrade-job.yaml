{{- $pause := true }}

{{- /* Lookup cluster. */}}
{{- $cluster := lookup "cluster.x-k8s.io/v1beta2" "Cluster" $.Release.Namespace (include "cluster.resource.name" $) }}
{{- if $cluster }}
{{- /* Get version. */}}
{{- $version := get $cluster.metadata.labels "release.giantswarm.io/version" }}
{{- /* If version is greater than or equal to v35.0.0... */}}
{{- if and $version (semverCompare ">=35.0.0" $version) }}
{{- /* ... then do not pause charts. */}}
{{- $pause = false }}
{{- end }}
{{- end }}

{{- if $pause }}
{{- range $target := list "mc" "wc" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cluster.resource.name" $ }}-pause-{{ $target }}-charts
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cluster.labels.common.all" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "cluster.labels.common.all" $ | nindent 8 }}
    spec:
      {{- if eq $target "mc" }}
      serviceAccountName: automation
      {{- else if eq $target "wc" }}
      automountServiceAccountToken: false
      volumes:
      - name: kubeconfig
        secret:
          secretName: {{ include "cluster.resource.name" $ }}-kubeconfig
          items:
          - key: value
            path: kubeconfig
      {{- end }}
      containers:
      - name: kubectl
        image: gsoci.azurecr.io/giantswarm/docker-kubectl:1.36.3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        {{- if eq $target "wc" }}
        volumeMounts:
        - name: kubeconfig
          subPath: kubeconfig
          mountPath: /etc/kubeconfig
          readOnly: true
        env:
        - name: KUBECONFIG
          value: /etc/kubeconfig
        {{- end }}
        args:
        - annotate
        - charts.application.giantswarm.io
        - --namespace
        - giantswarm
        - --selector
        - giantswarm.io/cluster={{ include "cluster.resource.name" $ }},helm.sh/chart
        - chart-operator.giantswarm.io/paused=true
        - --overwrite
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
      restartPolicy: Never
  activeDeadlineSeconds: 30
  ttlSecondsAfterFinished: 3600
{{- end }}
{{- end }}
