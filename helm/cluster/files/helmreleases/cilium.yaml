appName: cilium
# repo: giantswarm/cilium-app
version: 1.8.1

disable: {{ not $.Values.global.connectivity.cni.managed }}
timeout: 1h
remediationRetries: 0

namespace: kube-system
defaultValues:
  ipam:
    mode: kubernetes
  k8sServiceHost: auto
  {{- if eq (include "cluster.app.version.satisfies" (dict "root" $ "appName" "cilium" "constraint" ">=1.7.0")) "true" }}
  k8s:
    apiServerURLs: auto
  {{- end }}
  kubeProxyReplacement: "true"
  operator:
    tolerations:
    {{- include "cluster.internal.apps.cilium.operator.tolerations" $ | nindent 4 }}
  hubble:
    relay:
      tolerations:
      {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 6 }}
    ui:
      tolerations:
      {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 6 }}
  certgen:
    tolerations:
    {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 4 }}
  # Configured by provider.
  defaultPolicies: {}
  # Configured by provider.
  extraPolicies: {}
