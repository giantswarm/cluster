appName: cilium
# repo: giantswarm/cilium-app
version: 1.6.0

timeout: 1h
remediationRetries: 0

namespace: kube-system
defaultValues:
  ipam:
    mode: kubernetes
  k8sServiceHost: auto
  kubeProxyReplacement: "true"
  hubble:
    relay:
      tolerations:
      {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 6 }}
    ui:
      tolerations:
      {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 6 }}
  certgen:
    tolerations:
    {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 4 }}
  # Configured by provider.
  defaultPolicies: {}
  # Configured by provider.
  extraPolicies: {}
