appName: cert-exporter
# repo: giantswarm/cert-exporter
version: 2.13.0
dependsOn:
- cilium
- kyverno-crds
- prometheus-operator-crd
- vertical-pod-autoscaler-crd

# DaemonSet rollouts exceed the default 5m timeout on large clusters.
timeout: 30m

namespace: kube-system
defaultValues:
  ciliumNetworkPolicy:
    enabled: true
